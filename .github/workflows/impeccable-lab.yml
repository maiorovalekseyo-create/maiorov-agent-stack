name: Impeccable integration lab

on:
  push:
    branches: [experiment/impeccable-v4.5.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Impeccable and Playwright verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      IMPECCABLE_NO_TELEMETRY: "1"

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned Impeccable skill bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/impeccable"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/impeccable/universal.zip" \
            https://github.com/pbakaus/impeccable/releases/download/skill-v4.5.2/universal.zip
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/impeccable/universal.zip.sig.json" \
            https://github.com/pbakaus/impeccable/releases/download/skill-v4.5.2/universal.zip.sig.json
          node integrations/impeccable/verify-bundle.mjs \
            "$RUNNER_TEMP/impeccable/universal.zip" \
            "$RUNNER_TEMP/impeccable/universal.zip.sig.json" \
            integrations/impeccable/versions.json \
            > "$RUNNER_TEMP/impeccable/skill-integrity.json"

      - name: Download and verify pinned Impeccable engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/impeccable"
          curl --fail --location --silent --show-error \
            --output impeccable-linux-x64 \
            https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.14/impeccable-linux-x64
          curl --fail --location --silent --show-error \
            --output impeccable-linux-x64.sha256 \
            https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.14/impeccable-linux-x64.sha256
          sha256sum --check impeccable-linux-x64.sha256
          chmod +x impeccable-linux-x64
          ./impeccable-linux-x64 engine-probe | tee engine-probe.txt

      - name: Run Impeccable before and after
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/impeccable-lab/artifacts
          ENGINE="$RUNNER_TEMP/impeccable/impeccable-linux-x64"

          set +e
          "$ENGINE" detect tests/impeccable-lab/baseline/index.html --json \
            > tests/impeccable-lab/artifacts/impeccable-before.json
          BEFORE_EXIT=$?
          "$ENGINE" detect tests/impeccable-lab/fixed/index.html --json \
            > tests/impeccable-lab/artifacts/impeccable-after.json
          AFTER_EXIT=$?
          set -e

          printf '{"before":%s,"after":%s}\n' "$BEFORE_EXIT" "$AFTER_EXIT" \
            > tests/impeccable-lab/artifacts/detector-exit-codes.json
          test "$BEFORE_EXIT" -eq 2
          test "$AFTER_EXIT" -eq 0
          node tests/impeccable-lab/compare-results.mjs \
            tests/impeccable-lab/artifacts/impeccable-before.json \
            tests/impeccable-lab/artifacts/impeccable-after.json \
            tests/impeccable-lab/seeded-defects.json \
            tests/impeccable-lab/artifacts

      - name: Verify automatic routing configuration
        working-directory: tests/impeccable-lab
        run: node check-routing.mjs | tee artifacts/routing-check.json

      - name: Install Playwright Test
        working-directory: tests/impeccable-lab
        run: npm install --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        working-directory: tests/impeccable-lab
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        working-directory: tests/impeccable-lab
        run: npx playwright test

      - name: Collect integrity evidence
        if: always()
        shell: bash
        run: |
          mkdir -p tests/impeccable-lab/artifacts/integrity
          cp "$RUNNER_TEMP/impeccable/skill-integrity.json" tests/impeccable-lab/artifacts/integrity/ 2>/dev/null || true
          cp "$RUNNER_TEMP/impeccable/engine-probe.txt" tests/impeccable-lab/artifacts/integrity/ 2>/dev/null || true
          cp "$RUNNER_TEMP/impeccable/impeccable-linux-x64.sha256" tests/impeccable-lab/artifacts/integrity/ 2>/dev/null || true

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-playwright-report-${{ github.run_id }}
          path: |
            tests/impeccable-lab/artifacts/
            tests/impeccable-lab/playwright-report/
            tests/impeccable-lab/test-results/
          if-no-files-found: warn
          retention-days: 14
